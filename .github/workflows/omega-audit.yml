name: QCAL Ω Audit

on:
  push:
    branches: [main, 'feat/qcal-omega-audit']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate Ω ledger
        run: python audit/validate_omega_ledger.py
      - name: Run Ω tests
        run: python -m pytest tests/test_omega_ledger.py -q
