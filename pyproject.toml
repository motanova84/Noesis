[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-core"
version = "0.1.0"
description = "Deterministic core primitives for the Noesis ecosystem"
requires-python = ">=3.10"

[project.scripts]
noesis = "noesis_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["noesis_core*", "noesis_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
