[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-runtime"
version = "0.2.0"
description = "Public operational runtime for the Noesis/QCAL ecosystem"
requires-python = ">=3.10"

[project.scripts]
noesis = "noesis_cli.__main__:main"
noesis-api = "noesis_core.api:serve"

[tool.setuptools.packages.find]
include = ["noesis_core*", "noesis_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
